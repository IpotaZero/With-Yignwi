<div class="page" id="title">
    <div id="aspect">
        <h1>風呂無し、<br />屋根無し、<br />地獄行き。</h1>

        <div id="title-buttons">
            <button data-link="#stage-select">始める</button>
            <button data-link="#how-to-play">遊び方</button>
            <button data-link="#option">設定</button>
            <button id="fullscreen">全画面</button>
            <button data-link="#credit">クレヂット</button>
            <button id="omake">オマケ</button>
        </div>
    </div>
</div>

<img id="flower" src="assets/images/flower.png" alt="" />

<div class="page" id="how-to-play">
    <button data-back="1" class="back">戻る</button>
    <div id="explanation">
        <p>いくつかのマスをクリックして0だけにしよう。</p>
        <p>適当に押すも良し、ガチ攻略するも良し。</p>
        <p>ホバーすると重み付けが見られます。</p>
    </div>

    <img id="htp-img" src="assets/images/how-to-play.png" alt="あそびかた" />
</div>

<div class="page" id="option">
    <button data-back="1" class="back">戻る</button>

    <div>
        <label for="">BGM</label>
        <input type="range" class="volume-bgm" min="0" max="1" step="0.1" />
    </div>

    <div>
        <label for=""> SE</label>
        <input type="range" class="volume-se" min="0" max="1" step="0.1" />
    </div>

    <div>
        <button id="delete-data">データを消す</button>
    </div>
</div>

<div class="page" id="credit">

    </div>
</div>

<style>
    .back {
        position: absolute;
